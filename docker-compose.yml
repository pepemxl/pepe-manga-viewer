services:
  mysql:
    image: mysql:8.0
    container_name: pepe-manga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pepe-mangaroot
      MYSQL_DATABASE: pepe-manga
      MYSQL_USER: pepe-manga
      MYSQL_PASSWORD: pepe-mangapass
    ports:
      - "8203:3306"
    volumes:
      - pepe-manga-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upepe-manga", "-ppepe-mangapass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: pepe-manga-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://pepe-manga:pepe-mangapass@mysql:3306/pepe-manga
      MANGA_ROOT: /manga
      SEED_SAMPLE: "1"
    ports:
      - "8202:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/sample_manga:/manga
      # Bridge to a host directory so the user can add sources outside the container.
      # Default points back at sample_manga so the mount is always valid; override
      # by setting HOST_MEDIA_DIR in .env (see .env.example).
      - ${HOST_MEDIA_DIR:-./backend/sample_manga}:/host:ro

  frontend:
    build: ./frontend
    container_name: pepe-manga-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE: http://localhost:8202
    ports:
      - "8201:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro

volumes:
  pepe-manga-mysql-data:
